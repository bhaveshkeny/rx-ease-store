name: CI

on:
  push:
    branches: [ main, 'feature/bhaveshkeny-infra' ]
  pull_request:
    branches: [ main, 'feature/bhaveshkeny-infra' ]
  workflow_dispatch:
    inputs:
      build_images:
        description: 'Build and push Docker images (true/false)'
        required: false
        default: 'true'

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: 'npm'
      - name: Install and build
        run: |
          set -e
          # try a clean install first; if lockfile is out of sync, fall back to npm install
          npm ci || npm install
          npm run build

  docker-images:
    name: Build and push images (optional)
    runs-on: ubuntu-latest
    needs: [ frontend, build-backend]
    if: github.event_name != 'pull_request' && (github.event.inputs.build_images == 'true' || github.event.inputs.build_images == null)
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}
      - name: Build and push backend image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: infra/Dockerfile.backend
          push: true
          tags: ghcr.io/${{ github.repository }}-backend:latest
      - name: Build and push frontend image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: infra/Dockerfile.frontend
          push: true
          tags: ghcr.io/${{ github.repository }}-frontend:latest

  build-backend:
    name: Build backend image
    runs-on: ubuntu-latest
    # Run on pushes to the feature branch, or when manually requested via build_images input
    if: github.ref == 'refs/heads/feature/bhaveshkeny-infra' || github.event.inputs.build_images == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Log in to GitHub Container Registry
        if: github.event.inputs.build_images == 'true'
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}
      - name: Build (and push if requested) backend image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: infra/Dockerfile.backend
          push: ${{ github.event.inputs.build_images == 'true' }}
          tags: ghcr.io/${{ github.repository }}-backend:${{ github.sha }},ghcr.io/${{ github.repository }}-backend:latest
