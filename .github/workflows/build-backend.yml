name: Build Backend Image

on:
  workflow_dispatch:
    inputs:
      push:
        description: 'Push image to GHCR (true/false)'
        required: false
        default: 'false'

jobs:
  build-backend:
    name: Build backend Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Log in to GitHub Container Registry
        if: ${{ github.event.inputs.push == 'true' }}
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (and push if requested) backend image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: infra/Dockerfile.backend
          push: ${{ github.event.inputs.push == 'true' }}
          tags: ghcr.io/${{ github.repository_owner }}/${{ github.repository }}-backend:latest
